re — curriculum-aligned study area for CHEW.","areasOfConcentration":["Basic accounting concepts","Cashbook and records","Budgeting","Receipts and payments","Internal controls","Reporting"],"handout":{"status":"curriculum_aligned","note":"Study content is organized from the CHPRBN curriculum and current national guidance; clinical protocols must follow the current authorized Standing Orders."},"sources":[]},{"id":"che151","code":"CHE151","name":"Health Management Information System","programme":"CHEW","description":"Health Management Information System — curriculum-aligned study area for CHEW.","areasOfConcentration":["Data sources","Data quality","Indicators","Reporting","Analysis","Use of information"],"handout":{"status":"curriculum_aligned","note":"Study content is organized from the CHPRBN curriculum and current national guidance; clinical protocols must follow the current authorized Standing Orders."},"sources":[]},{"id":"che152","code":"CHE152","name":"Entrepreneurship Education","programme":"CHEW","description":"Entrepreneurship Education — curriculum-aligned study area for CHEW.","areasOfConcentration":["Entrepreneurship concepts","Opportunity identification","Basic business planning","Resource management","Small enterprise ethics"],"handout":{"status":"curriculum_aligned","note":"Study content is organized from the CHPRBN curriculum and current national guidance; clinical protocols must follow the current authorized Standing Orders."},"sources":[]},{"id":"che153","code":"CHE153","name":"Research Project","programme":"CHEW","description":"Research Project — curriculum-aligned study area for CHEW.","areasOfConcentration":["Research proposal","Literature review","Methods","Data collection","Analysis","Report writing","Ethics"],"handout":{"status":"curriculum_aligned","note":"Study content is organized from the CHPRBN curriculum and current national guidance; clinical protocols must follow the current authorized Standing Orders."},"sources":[]}],"scenarios":[{"id":"scn-01","title":"Child with diarrhoea and danger signs","course":"Child Health / IMCI","prompt":"A 2-year-old child is brought to a PHC with diarrhoea. The caregiver says the child is unusually sleepy and is not drinking well. What should the learner prioritize?","steps":["Check general danger signs and assess the child systematically.","Assess hydration and other relevant IMCI findings.","Use the applicable protocol to classify the illness.","Provide only authorized immediate care and arrange urgent referral when indicated.","Document findings and give appropriate caregiver education."],"key":"The key skill is recognition of danger signs, structured assessment and timely referral—not trying to manage a severe case beyond scope."},{"id":"scn-02","title":"Pregnant client with a warning sign","course":"Maternal Health","prompt":"A pregnant client presents at a community service point with a complaint that may represent a pregnancy danger sign. What is the safest learning approach?","steps":["Take focused history and assess vital signs/relevant findings.","Identify whether the symptom matches a protocol-defined danger sign.","Avoid assuming the complaint is normal pregnancy discomfort.","Refer urgently according to the applicable protocol when indicated.","Document and communicate the important findings."],"key":"Maternal assessment is strongly linked to early recognition and referral."},{"id":"scn-03","title":"Immunization session","course":"Immunity and Immunisation","prompt":"During a routine immunization session, a caregiver asks whether a child can receive a scheduled vaccine after a previous mild expected reaction. What should the learner do?","steps":["Review the immunization record and relevant history.","Distinguish expected minor reactions from true contraindications/precautions.","Follow the current Nigerian immunization guidance.","Counsel the caregiver clearly and document the service."],"key":"The exam skill is distinguishing contraindications/precautions from expected minor reactions and using the current schedule."},{"id":"scn-04","title":"Suspected communicable disease","course":"Control of Communicable Diseases","prompt":"A client presents with symptoms that raise concern for a communicable disease. What should happen before routine community follow-up?","steps":["Apply appropriate infection-prevention precautions.","Collect relevant history and findings within scope.","Use the required reporting/surveillance pathway when applicable.","Arrange referral or further assessment according to protocol.","Provide clear prevention advice to the client/household."],"key":"Communicable disease control combines case recognition, infection prevention, surveillance, education and referral."}],"sources":[{"title":"CHPRBN official home and Resources","url":"https://chprbn.gov.ng/home2/","note":"Official CHPRBN portal. Its Resources section lists JCHEW Curriculum, CHEW Curriculum and National Standing Order resources."},{"title":"CHPRBN Education Development and Standards","url":"https://chprbn.gov.ng/department-education-development-and-standards/","note":"Official Board department responsible for curriculum development, accreditation, examination and certification."},{"title":"CHPRBN 2024 revised National Standing Orders — JCHEW","url":"https://chprbn.gov.ng/wp-content/uploads/2024/12/JCHEW-Section-1-7-TEXT-1.pdf","note":"Official CHPRBN 2024 revised National Standing Orders for JCHEWs."},{"title":"CHPRBN 2024 revised National Standing Orders — CHEW","url":"https://chprbn.gov.ng/wp-content/uploads/2024/12/CHEW-Section-1-7-TEXT.pdf","note":"Official CHPRBN 2024 revised National Standing Orders for CHEWs."},{"title":"NPHCDA Community-Based Health Workers","url":"https://nphcda.gov.ng/cbhws/","note":"Official NPHCDA information on the redesigned community-based health workforce and priority community service areas."},{"title":"NPHCDA CHIPS Programme","url":"https://nphcda.gov.ng/chips/","note":"Official NPHCDA source on community linkages, home visits, referrals, community participation and PHC connections."},{"title":"NPHCDA Continuing Professional Education","url":"https://learn.nphcda.gov.ng/","note":"Official NPHCDA learning platform with frontline PHC modules."},{"title":"WHO","url":"https://www.who.int/","note":"Supporting international public-health and clinical guidance; Nigerian/CHPRBN protocols take priority where applicable."},{"title":"UNICEF","url":"https://www.unicef.org/","note":"Supporting child-health, immunization and community-health resources."}]};

const MATERIAL={"Use of English Language":{"Introduction":"Use of English Language is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the JCHEW scope.","Key concepts":"The main concentration areas are: Language and communication, Vocabulary and medical registers, Sentence construction, Comprehension and summary, Writing skills. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Use of English Language.","Understand Language and communication.","Understand Vocabulary and medical registers.","Understand Sentence construction.","Understand Comprehension and summary.","Understand Writing skills."],"Hausa explanation":"Use of English Language yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da ake bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Introduction to Primary Health Care":{"Introduction":"Primary Health Care (PHC) is essential health care made accessible to individuals and families in the community through practical, scientifically sound and socially acceptable methods, with community participation and at a cost the community and country can afford. In Nigeria, PHC is the foundation of the health system and links communities with higher levels of care.","Key concepts":"Equity, community participation, intersectoral collaboration, appropriate technology, prevention, health promotion, accessibility, referral and continuity of care. Know the difference between primary care as a level of service and PHC as a broad approach to health.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Identify community health needs, involve community structures, plan outreach, provide health education, document services, identify danger signs and use the referral pathway. JCHEW/CHEW duties must remain within their authorized scope.","Common exam traps":"Do not confuse PHC with only treatment at a health centre. Do not confuse community participation with simply informing people after decisions have already been made. Equity is fair access according to need, not identical services for everyone.","Key points to remember":["Know the definition and purpose of Introduction to Primary Health Care.","Understand Concept of health.","Understand Definition and principles of PHC.","Understand Components of PHC.","Understand Tiers of the Nigerian health system.","Understand Community participation."],"Hausa explanation":"PHC ba wai magani kawai ba ne. Tsari ne da ya haɗa rigakafi, inganta lafiya, ilimantarwa, shiga tsakani da al’umma, gano matsaloli, referral da ci gaba da kulawa a matakin farko.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Professional Ethics":{"Introduction":"Professional ethics guides safe, respectful, accountable and lawful conduct in community health practice.","Key concepts":"Confidentiality, consent, respect, accountability, competence, scope of practice, privacy and patient safety.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Protect private information, communicate respectfully, document accurately and seek supervision/referral when outside scope.","Common exam traps":"Confidentiality is not the same as secrecy in every situation; lawful reporting and patient safety duties may apply.","Key points to remember":["Know the definition and purpose of Professional Ethics.","Understand Ethics and etiquette.","Understand Professional responsibilities.","Understand Scope and limitations.","Understand Confidentiality and privacy.","Understand Accountability."],"Hausa explanation":"Professional ethics yana jagorantar ma’aikacin lafiya ya yi aiki cikin mutunci, sirri, gaskiya, accountability da bin scope.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Introduction to Behavioural Science":{"Introduction":"Introduction to Behavioural Science is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the JCHEW scope.","Key concepts":"The main concentration areas are: Behaviour and learning, Motivation, Attitudes, Social influences, Behaviour change, Application to health practice. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphas entify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Reproductive Health.","Understand Reproductive anatomy and physiology.","Understand Sexual health.","Understand STIs.","Understand Adolescent reproductive health.","Understand Preconception care."],"Hausa explanation":"Reproductive Health yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da ake bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Maternal Health":{"Introduction":"Maternal health covers care before, during and after pregnancy, with emphasis on prevention, early detection of complications, respectful care, birth preparedness, counselling and timely referral.","Key concepts":"Antenatal care, danger signs in pregnancy, birth preparedness and complication readiness, normal labour, postnatal care, maternal nutrition, prevention of infection and referral. The practitioner should recognize conditions requiring higher-level care rather than attempting unauthorized management.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Take an appropriate history, assess vital signs and relevant symptoms, identify danger signs, support antenatal attendance, counsel on nutrition and birth preparedness, document findings and refer according to protocol.","Common exam traps":"Do not treat every pregnancy complaint as normal. Questions may test recognition of danger signs and the correct next action. Distinguish routine antenatal education from emergency referral.","Key points to remember":["Know the definition and purpose of Maternal Health.","Understand Antenatal care.","Understand Danger signs in pregnancy.","Understand Normal labour.","Understand Postnatal care.","Understand Maternal complications."],"Hausa explanation":"Kula da lafiyar mai ciki ta haɗa da ANC, gano danger signs da wuri, shirya haihuwa, ilimantarwa, rigakafin matsaloli da referral cikin lokaci idan an ga abin da ya wuce ikon matakin farko.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Modified Essential Care of the Newborn":{"Introduction":"Essential newborn care focuses on immediate assessment, warmth, breathing, breastfeeding, infection prevention, cord care and recognition of danger signs.","Key concepts":"Thermal protection, early breastfeeding, clean cord care, infection prevention, breathing assessment and newborn danger signs. Any severe sign requires urgent action and referral according to the current protocol.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Keep the newborn warm, support early breastfeeding, maintain clean practices, observe breathing and activity, document findings and refer when danger signs are present.","Common exam traps":"Do not confuse normal transitional findings with danger signs. The priority is rapid recognition of serious illness and appropriate escalation.","Key points to remember":["Know the definition and purpose of Modified Essential Care of the Newborn.","Understand Immediate newborn care.","Understand Thermal care.","Understand Breastfeeding.","Understand Newborn danger signs.","Understand Cord care."],"Hausa explanation":"Essential newborn care yana mai da hankali kan dumi, numfashi, fara shayarwa da wuri, tsaftar cibiya, hana infection da gano danger signs.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Communicable Diseases":{"Introduction":"Communicable disease control depends on understanding transmission, surveillance, prevention, early recognition and referral.","Key concepts":"Chain of infection, standard precautions, outbreak recognition, reporting and community prevention.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Identify suspected illness, protect yourself and others, document and report as required, educate households and refer severe cases.","Common exam traps":"Transmission route determines appropriate prevention measures.","Key points to remember":["Know the definition and purpose of Communicable Diseases.","Understand Chain of infection.","Understand Surveillance.","Understand Prevention and control.","Understand Outbreak concepts.","Understand Common communicable diseases."],"Hausa explanation":"Cututtukan da ake iya yadawa suna bukatar fahimtar hanyar yaduwa, surveillance, prevention da referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Anatomy and Physiology II":{"Introduction":"Anatomy and Physiology II is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the CHEW scope.","Key concepts":"The main concentration areas are: Cardiovascular system, Respiratory system, Digestive system, Urinary system, Reproductive system. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definit treach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Laboratory Services.","Understand Specimen collection.","Understand Urinalysis.","Understand Haemoglobin testing.","Understand Rapid diagnostic tests.","Understand Laboratory safety."],"Hausa explanation":"Laboratory Services yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da ake bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Community-Based Health Care":{"Introduction":"Community-based health care brings health action closer to households through participation, assessment, education, outreach, referral and follow-up.","Key concepts":"Community entry, needs assessment, community diagnosis, mobilization, participation, home visits and referral linkages.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Build trust, identify stakeholders, collect relevant information, prioritize problems with the community and document actions.","Common exam traps":"Community diagnosis is more than listing diseases; it includes systematic identification and prioritization of health problems and needs.","Key points to remember":["Know the definition and purpose of Community-Based Health Care.","Understand Community entry.","Understand Community diagnosis.","Understand Needs assessment.","Understand Community mobilization.","Understand Home visits."],"Hausa explanation":"Community-based health care yana kawo ayyukan lafiya kusa da gidaje ta hanyar shiga da al’umma, home visits, health education, referral da follow-up.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Supervised Clinical Experience":{"Introduction":"Supervised Clinical Experience is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the JCHEW scope.","Key concepts":"The main concentration areas are: Clinical orientation, Observed procedures, Documentation, Communication, Safety, Referral. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Supervised Clinical Experience.","Understand Clinical orientation.","Understand Observed procedures.","Understand Documentation.","Understand Communication.","Understand Safety."],"Hausa explanation":"Supervised Clinical Experience yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da ake bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Immunity and Immunisation":{"Introduction":"Immunization protects individuals and communities by stimulating immune responses against vaccine-preventable diseases. Safe immunization depends on correct vaccine handling, schedule adherence, screening for contraindications/precautions, infection prevention and accurate documentation.","Key concepts":"Know active versus passive immunity, live versus non-live vaccine concepts, cold chain, vaccine vial management, adverse events following immunization, missed opportunities and the importance of completing the recommended schedule.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Maintain the required storage conditions, check vaccine and diluent status, use safe injection practices, document doses and counsel caregivers about expected reactions and when to seek care. Use the current Nigerian routine immunization schedule rather than relying on an old timetable.","Common exam traps":"Do not confuse immunity acquired after vaccination with passive immunity from ready-made antibodies. Do not assume every mild reaction is a contraindication. Always distinguish a contraindication from a precaution.","Key points to remember":["Know the definition and purpose of Immunity and Immunisation.","Understand Types of immunity.","Understand Vaccine-preventable diseases.","Understand Routine immunization principles.","Understand Cold chain.","Understand Adverse events."],"Hausa explanation":"Immunization hanya ce ta kare mutum da al’umma daga cututtukan da allura za ta iya hana su. Muhimman abubuwa sun haɗa da cold chain, jadawalin allura, safety, rubuta bayanai da kula da AEFI.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Primary Eye Care":{"Introduction":"Primary Eye Care is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the JCHEW scope.","Key concepts":"The main concentration areas are: Common eye problems, Red flags, Eye hygiene, Basic assessment, Referral. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Primary Eye Care.","Understand Common eye problems.","Understand Red flags.","Understand Eye hygiene.","Understand Basic assessment.","Understand Referral."],"Hausa explanation":"Primary Eye Care yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da a T conditions.","Understand Basic assessment.","Understand Danger signs.","Understand Prevention.","Understand Referral."],"Hausa explanation":"Primary Ear, Nose and Throat Care yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da ake bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Oral Health Care":{"Introduction":"Oral Health Care is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the JCHEW scope.","Key concepts":"The main concentration areas are: Oral hygiene, Dental caries, Periodontal disease, Common oral conditions, Oral health education, Referral. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Oral Health Care.","Understand Oral hygiene.","Understand Dental caries.","Understand Periodontal disease.","Understand Common oral conditions.","Understand Oral health education."],"Hausa explanation":"Oral Health Care yana daga cikin muhimman fannoni na Community Health. Ka fahimci ma’anarsa, muhimman abubuwansa, yadda ake amfani da shi a PHC da lokacin da ake bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Child Health / IMCI":{"Introduction":"Integrated Management of Childhood Illness (IMCI) uses a systematic approach to assess sick children, identify danger signs and common conditions, classify illness, provide appropriate care within protocol, counsel the caregiver and arrange follow-up or referral.","Key concepts":"Always begin with general danger signs and the child’s age. Important assessment areas include cough or difficult breathing, diarrhoea, fever, ear problems, nutrition, anaemia and immunization. Classification is linked to action; a serious classification requires urgent action according to the applicable protocol.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Check the caregiver history, observe the child, assess breathing and hydration, check feeding and immunization status, identify danger signs, record findings and refer urgently when indicated. Do not treat beyond authorized protocols.","Common exam traps":"A symptom is not automatically a diagnosis. Classification and referral decisions depend on defined signs. A child who cannot drink/breastfeed, vomits everything, has convulsions, is lethargic/unconscious or has other protocol-defined danger signs needs urgent attention.","Key points to remember":["Know the definition and purpose of Child Health / IMCI.","Understand IMCI approach.","Understand Child danger signs.","Understand Cough/difficulty breathing.","Understand Diarrhoea.","Understand Fever/malaria."],"Hausa explanation":"A IMCI ana fara da duba danger signs, sannan a tantance alamomin cututtuka kamar tari, gudawa, zazzabi, matsalar kunne da rashin abinci mai gina jiki. A bi tsarin da aka amince da shi, sannan a tura yaro idan akwai bukatar referral.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Family Planning":{"Introduction":"Family planning enables individuals and couples to decide freely and responsibly the number and spacing of children through informed choice and access to appropriate methods.","Key concepts":"Counselling, informed choice, effectiveness, duration, reversibility, side effects, contraindications/eligibility and referral. Method choice should be based on the client’s informed preference and applicable eligibility guidance.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Provide respectful counselling, assess relevant history, explain options and expected effects, address misconceptions, document the service and refer when the method or condition is outside scope.","Common exam traps":"Do not confuse effectiveness with duration. Do not present one method as universally best for every client.","Key points to remember":["Know the definition and purpose of Family Planning.","Understand Counselling.","Understand Method categories.","Understand Eligibility and precautions.","Understand Side effects.","Understand Follow-up."],"Hausa explanation":"Family planning yana taimaka wa ma’aurata su tsara tazarar haihuwa ta hanyar samun bayanai da zabi cikin yardar rai.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Community Mental Health":{"Introduction":"Community Mental Health is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the not a substitute for supervised clinical practice."},"Essential Medicines":{"Introduction":"Essential medicines are selected to meet priority health needs and should be available, affordable, quality-assured and used rationally.","Key concepts":"Generic names, indications, contraindications, dose, route, frequency, duration, storage, adverse effects and rational medicine use.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Check the correct patient, medicine, dose, route and timing; document administration; counsel appropriately and refer adverse or severe reactions.","Common exam traps":"Do not confuse generic name with brand name. Do not infer that every medicine is authorized for every cadre or condition.","Key points to remember":["Know the definition and purpose of Essential Medicines.","Understand Essential medicines concept.","Understand Rational drug use.","Understand Storage.","Understand Adherence.","Understand Adverse drug reactions."],"Hausa explanation":"Essential medicines su ne magungunan da aka zaba domin muhimman bukatun lafiya. Amfani da su ya kamata ya kasance bisa ka’ida da scope na practitioner.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Health Management Information System":{"Introduction":"HMIS is the organized collection, processing, analysis, reporting and use of health information for decision-making.","Key concepts":"Data sources, indicators, completeness, accuracy, timeliness, confidentiality, reporting and data use.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Record at source, check data quality, submit reports on time and use findings for service improvement.","Common exam traps":"Data are raw observations; information is processed or interpreted data used for decisions.","Key points to remember":["Know the definition and purpose of Health Management Information System.","Understand Data sources.","Understand Data quality.","Understand Indicators.","Understand Reporting.","Understand Analysis."],"Hausa explanation":"HMIS tsari ne na tattara, sarrafawa, nazari da amfani da bayanan lafiya domin yanke shawara.","Safety note":"Clinical decisions must follow the current CHPRBN National Standing Orders and other applicable authorized Nigerian protocols. This academy is for education and examination preparation, not a substitute for supervised clinical practice."},"Occupational Health and Safety Education":{"Introduction":"Occupational Health and Safety Education is a curriculum-aligned area of Community Health education. It develops knowledge, practical reasoning and professional judgement relevant to the CHEW scope.","Key concepts":"The main concentration areas are: Workplace hazards, Risk assessment, PPE, Occupational diseases, Accident prevention, Health surveillance. Learn the meaning of each area, how the concepts relate to one another, and how they apply to community health practice.","Assessment and application":"Use a structured approach: understand the problem, collect relevant information, identify priority findings, choose an appropriate action within scope, document the service and arrange referral or follow-up when indicated.","Prevention and health education":"Community Health practice emphasizes prevention, health promotion, early recognition, respectful communication and practical health education. Advice should be accurate, culturally appropriate and consistent with current Nigerian guidance.","Referral and follow-up":"Recognize red flags and cases outside the practitioner’s authorized scope. Refer using the appropriate pathway, communicate relevant findings, document the referral and support follow-up where applicable.","Practical points":"Apply the topic to household, outreach, PHC and community settings. Keep documentation clear and protect confidentiality.","Common exam traps":"Read the wording carefully. Separate definitions from examples, causes from risk factors, signs from symptoms, prevention from treatment, and routine care from referral indications.","Key points to remember":["Know the definition and purpose of Occupational Health and Safety Education.","Understand Workplace hazards.","Understand Risk assessment.","Understand PPE.","Understand Occupational diseases.","Understand Accident prevention."],"Hausa explanation":"Occupational Health and Safety Education yana daga cikin muhi function library(){let qs=filteredQuestions();let c=state.courseId?courseById(state.courseId):null;return layout('Past Questions Library',`<div class="card p-4"><div class="grid md:grid-cols-5 gap-3"><input value="${esc(state.search)}" oninput="state.search=this.value;render()" placeholder="Search question, topic, keyword, year..." class="md:col-span-2 rounded-xl border bg-transparent px-3 py-3"><select onchange="state.courseId=this.value||null;state.topic=null;render()" class="rounded-xl border bg-transparent px-3 py-3"><option value="">All courses</option>${courses().map(x=>`<option value="${x.id}" ${state.courseId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select onchange="state.year=this.value;render()" class="rounded-xl border bg-transparent px-3 py-3"><option value="all">All years</option>${YEARS.map(y=>`<option value="${y}" ${String(state.year)===String(y)?'selected':''}>${y}</option>`).join('')}</select><select onchange="state.type=this.value;render()" class="rounded-xl border bg-transparent px-3 py-3"><option value="all">All types</option><option value="auth" ${state.type==='auth'?'selected':''}>Authentic Past Question</option><option value="practice" ${state.type==='practice'?'selected':''}>Original Practice Question</option></select><button onclick="startFilteredCBT()" class="rounded-xl bg-teal-700 text-white px-3 py-3 font-bold">CBT</button></div></div><div class="mt-5 flex items-center justify-between"><div class="font-black">${qs.length} result(s)</div><div class="text-sm text-slate-500">Authentic verified records: ${VERIFIED.filter(q=>q.programme===state.programme).length}</div></div><div class="mt-4 grid gap-4">${qs.length?qs.map(questionCard).join(''):`<div class="card p-6 border-amber-200 bg-amber-50 dark:bg-amber-950/20"><b>No independently verified national question record matches these filters.</b><p class="mt-2 text-sm">The academy will not manufacture a missing year or examination paper. Select Original Practice Question to study exam-aligned material separately.</p></div>`}</div>`)}
function questionCard(q){let auth=q.type==='authentic_past_question',book=store.bookmarks.questions.includes(q.id);return `<article class="card p-5"><div class="flex flex-wrap gap-2 items-center"><span class="rounded-full px-3 py-1 text-xs font-black ${auth?'badge-auth':'badge-practice'}">${auth?'AUTHENTIC PAST QUESTION':'ORIGINAL PRACTICE QUESTION'}</span><span class="text-xs text-slate-500">${q.year||'No exam year'} · ${esc(q.course)} · ${esc(q.topic)}</span><button onclick="toggleBookmarkQuestion('${q.id}')" class="ml-auto rounded-lg border px-3 py-1">${book?'★':'☆'}</button></div><h3 class="mt-3 font-bold text-lg">${esc(q.question)}</h3><div class="mt-3 grid sm:grid-cols-2 gap-2">${Object.entries(q.options).map(([k,v])=>`<div class="rounded-xl border p-3 text-sm"><b>${k}.</b> ${esc(v)}</div>`).join('')}</div><details class="mt-4"><summary class="cursor-pointer font-bold">Answer & explanation</summary><div class="mt-3 rounded-xl bg-slate-50 dark:bg-slate-800 p-4 text-sm"><p><b>Correct answer:</b> ${esc(q.answer)}</p><p class="mt-2"><b>Explanation:</b> ${esc(q.explanation)}</p><p class="mt-2"><b>Hausa:</b> ${esc(q.HausaExplanation||'')}</p><p class="mt-2"><b>Source:</b> ${q.sourceUrl?`<a class="text-teal-700 underline" href="${esc(q.sourceUrl)}" target="_blank" rel="noopener">${esc(q.source)}</a>`:esc(q.source)}</p>${auth?'':'<p class="mt-2 text-amber-700"><b>Notice:</b> This is an original learning question, not an official CHPRBN examination question.</p>'}</div></details><button onclick="openTopic('${courseByName(q.course)?.id||''}',${JSON.stringify(q.topic)})" class="mt-3 rounded-xl border px-3 py-2 text-sm font-bold">Study this topic →</button></article>`}
function courseByName(n){return courses().find(c=>c.name===n)||DATA.courses.find(c=>c.name===n)}
function toggleBookmarkQuestion(id){let a=store.bookmarks.questions,i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()}
function toggleBookmarkTopic(id,topic){let a=store.bookmarks.topics,i=a.findIndex(x=>x.id===id&&x.topic===topic);i<0?a.push({id,topic}):a.splice(i,1);save();render()}
function bookmarks(){let qs=allQuestions().filter(q=>store.bookmarks.questions.includes(q.id));let ts=store.bookmarks.topics;return layout('My Bookmarks',`<section><h2 class="text-xl font-black">Questions</h2><div class="mt-3 grid gap-3">${qs.length?qs.map(questionCard).join(''):'<div class="card p-5 text-slate-500">No bookmarked questions yet.</div>'}</div></section><section class="mt-7"><h2 class="text-xl font-black">Topics</h2><div class="mt-3 grid sm:grid-cols-2 gap-3">${ts.length?ts.map(x=>{let c=courseById(x.id);return `<button onclick="openTopic('${x.id}',${JSON.stringify(x.topic)})" class="card p-4 text-left"><b>${esc(x.topic)}</b><span class="block text-xs text-slate-500 mt-1">${esc(c?.name||'Course')} →</span></button>`}).join(''):'<div class="card p-5 text-slate-500">No bookmarked topics yet.</div>'}</div></section>`)}
function cbt(){return layout('CBT Center',`<div class="grid md:grid-cols-2 gap-4"><div class="card p-5"><h2 class="text-xl font-black">Build a CBT</h2><div class="mt-4 space-y-3"><label class="block text-sm font-bold">Course<select id="cbtCourse" class="mt-1 w-full rounded-xl border bg-transparent p-3"><option value="">All courses</option>${courses().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label class="block text-sm font-bold">Question type<select id="cbtType" class="mt-1 w-full rounded-xl border bg-transparent p-3"><option value="mixed">Mixed</option><option value="auth">Authentic only</option><option value="practice">Practice only</option></select></label><label class="block text-sm font-bold">Number of questions<input id="cbtN" type="number" min="1" max="50" value="20" class="mt-1 w-full rounded-xl border bg-transparent p-3"></label><label class="block text-sm font-bold">Timer<select id="cbtTime" class="mt-1 w-full rounded-xl border bg-transparent p-3"><option value="10">10 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>60 minutes</option><option value="custom">Custom</option></select></label><label id="customWrap" class="hidden block text-sm font-bold">Custom minutes<input id="customTime" type="number" min="1" max="180" value="30" class="mt-1 w-full rounded-xl border bg-transparent p-3"></label><button onclick="buildCBT()" class="w-full rounded-xl bg-teal-700 text-white p-3 font-black">START CBT</button></div></div><div class="card p-5"><h2 class="text-xl font-black">Available modes</h2><div class="mt-4 space-y-3 text-sm"><div><b>Course CBT</b><p class="text-slate-500">Questions from one course.</p></div><div><b>Authentic-only CBT</b><p class="text-slate-500">Only independently verified records. Currently 0.</p></div><div><b>Practice-only CBT</b><p class="text-slate-500">Original learning questions.</p></div><div><b>Mixed CBT</b><p class="text-slate-500">Combines available verified and practice records.</p></div><div><b>Filtered CBT</b><p class="text-slate-500">Use the Past Questions Library filters, then launch CBT.</p></div></div></div></div>`)}
function buildCBT(){let cid=document.getElementById('cbtCourse').value,type=document.getElementById('cbtType').value,n=Math.max(1,Math.min(50,Number(document.getElementById('cbtN').value)||20)),tm=document.getElementById('cbtTime').value;let mins=tm==='custom'?Math.max(1,Math.min(180,Number(document.getElementById('customTime').value)||30)):Number(tm);let qs=allQuestions().filter(q=>q.programme===state.programme);if(cid)qs=qs.filter(q=>q.course===courseById(cid)?.name);if(type==='auth')qs=qs.filter(q=>q.type==='authentic_past_question');if(type==='practice')qs=qs.filter(q=>q.type==='original_practice_question');startCBT(qs,Math.min(n,qs.length),mins)}
function startFilteredCBT(){let qs=filteredQuestions();startCBT(qs,Math.min(50,qs.length),30)}
function startCBT(qs,n,mins=30){if(!qs.length){toast('No questions match this set');return}let copy=[...qs].sort(()=>Math.random()-.5).slice(0,n);state.cbt={questions:copy,index:0,answers:{},flags:{},started:Date.now(),totalSeconds:mins*60,remaining:mins*60};state.page='run';render();clearInterval(state.cbt.timer);state.cbt.timer=setInterval(()=>{if(!state.cbt)return;state.cbt.remaining--;let el=document.getElementById('timer');if(el)el.textContent=formatTime(state.cbt.remaining);if(state.cbt.remaining<=0)finishCBT(true)},1000)}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function runCBT(){let c=state.cbt,q=c.questions[c.index],answered=c.answers[q.id];return layout('CBT',`<div class="flex items-center justify-between gap-3"><div><div class="text-sm text-slate-500">Question ${c.index+1} of ${c.questions.length}</div><div class="h-2 w-48 md:w-96 rounded-full bg-slate-200 dark:bg-slate-800 mt-2"><div class="h-2 rounded-full bg-teal-600" style="width:${((c.index+1)/c.questions.length)*100}%"></div></div></div><div id="timer" class="rounded-xl bg-slate-900 text-white px-4 py-2 font-black kbd">${formatTime(c.remaining)}</div></div><article class="mt-5 card p-5 md:p-7"><div class="flex flex-wrap gap-2"><span class="rounded-full px-3 py-1 text-xs font-black ${q.type==='authentic_past_question'?'badge-auth':'badge-practice'}">${q.type==='authentic_past_question'?'AUTHENTIC PAST QUESTION':'ORIGINAL PRACTICE QUESTION'}</span><span class="text-xs text-slate-500">${q.year||'Practice'} · ${esc(q.course)} · ${esc(q.topic)}</span><button onclick="flagQ()" class="ml-auto rounded-xl border px-3 py-2 font-bold">${c.flags[q.id]?'⚑ Flagged':'⚐ Flag'}</button></div><h2 class="mt-5 text-xl md:text-2xl font-black">${esc(q.question)}</h2><div class="mt-6 grid gap-3">${Object.entries(q.options).map(([k,v])=>`<button onclick="answerQ('${k}')" class="tap rounded-2xl border p-4 text-left ${answered===k?'border-teal-600 bg-teal-50 dark:bg-teal-950/30':''}"><b>${k}.</b> ${esc(v)}</button>`).join('')}</div></article><div class="mt-4 flex justify-between gap-2"><button onclick="prevQ()" class="rounded-xl border px-4 py-3" ${c.index===0?'disabled':''}>Previous</button><div class="flex gap-2">${c.index===c.questions.length-1?'<button onclick="finishCBT(false)" class="rounded-xl bg-emerald-700 text-white px-5 py-3 font-black">Submit</button>':'<button onclick="nextQ()" class="rounded-xl bg-teal-700 text-white px-5 py-3 font-black">Next</button>'}</div></div><div class="mt-5 grid grid-cols-10 gap-2">${c.questions.map((x,i)=>`<button onclick="jumpQ(${i})" class="rounded-lg border p-2 text-xs ${i===c.index?'bg-teal-700 text-white':''} ${c.answers[x.id]?'border-emerald-500':''} ${c.flags[x.id]?'ring-2 ring-amber-400':''}">${i+1}</button>`).join('')}</div><p class="mt-4 text-xs text-slate-500">Your answers are kept in memory for this session. Submit to store the result locally.</p></main>`)}
function answerQ(k){let q=state.cbt.questions[state.cbt.index];state.cbt.answers[q.id]=k;render()}
function flagQ(){let q=state.cbt.questions[state.cbt.index];state.cbt.flags[q.id]=!state.cbt.flags[q.id];render()}
function nextQ(){state.cbt.index=Math.min(state.cbt.questions.length-1,state.cbt.index+1);render()}
function prevQ(){state.cbt.index=Math.max(0,state.cbt.index-1);render()}
function jumpQ(i){state.cbt.index=i;render()}
function finishCBT(auto){if(!state.cbt)return;clearInterval(state.cbt.timer);let c=state.cbt,details=c.questions.map(q=>{let mine=c.answers[q.id]||null;let ok=mine===q.answer;let key=q.id;store.attempted[key]=(store.attempted[key]||{attempts:0,correct:0,wrong:0});store.attempted[key].attempts++;if(ok)store.attempted[key].correct++;else if(mine)store.attempted[key].wrong++;return {q,mine,ok,flagged:!!c.flags[q.id]}});let correct=details.filter(x=>x.ok).length,wrong=details.filter(x=>x.mine&&!x.ok).length,unanswered=details.filter(x=>!x.mine).length;state.results={details,total:c.questions.length,correct,wrong,unanswered,timeUsed:c.totalSeconds-c.remaining,auto};store.history.unshift({date:new Date().toISOString(),programme:state.programme,total:c.questions.length,correct,wrong,unanswered,pct:Math.round(correct/c.questions.length*100),timeUsed:c.totalSeconds-c.remaining});store.history=store.history.slice(0,30);save();state.cbt=null;state.page='results';render()}
function results(){let r=state.results,pct=Math.round(r.correct/r.total*100),flagged=r.details.filter(x=>x.flagged);let weak=weakTopicsFrom(r.details);return layout('CBT Result',`${r.auto?'<div class="danger card p-4 mb-4"><b>Time expired.</b> The test was submitted automatically.</div>':''}<div class="grid grid-cols-2 md:grid-cols-5 gap-3">${stat('Total',r.total)}${stat('Correct',r.correct)}${stat('Wrong',r.wrong)}${stat('Unanswered',r.unanswered)}${stat('Score',pct+'%')}</div><div class="mt-5 grid lg:grid-cols-3 gap-4"><div class="card p-5 lg:col-span-2"><h2 class="text-xl font-black">Detailed review</h2><div class="mt-4 space-y-3">${r.details.map((x,i)=>`<details class="rounded-xl border p-4"><summary class="cursor-pointer"><b>Question ${i+1}</b> · <span class="${x.ok?'text-emerald-700':x.mine?'text-rose-700':'text-slate-500'}">${x.ok?'CORRECT':x.mine?'WRONG':'UNANSWERED'}</span> · ${esc(x.q.topic)}</summary><div class="mt-3 text-sm"><p class="font-semibold">${esc(x.q.question)}</p><p class="mt-2"><b>Your answer:</b> ${esc(x.mine||'None')}</p><p><b>Correct answer:</b> ${esc(x.q.answer)}</p><p class="mt-2"><b>Explanation:</b> ${esc(x.q.explanation)}</p><p class="mt-2"><b>Hausa:</b> ${esc(x.q.HausaExplanation||'')}</p><p class="mt-2"><b>Course:</b> ${esc(x.q.course)} · <b>Topic:</b> ${esc(x.q.topic)}</p><p class="mt-2"><b>Type:</b> ${x.q.type==='authentic_past_question'?'AUTHENTIC PAST QUESTION':'ORIGINAL PRACTICE QUESTION'}</p>${!x.ok?`<button onclick="openTopic('${courseByName(x.q.course)?.id||''}',${JSON.stringify(x.q.topic)})" class="mt-3 rounded-xl bg-teal-700 text-white px-3 py-2 font-bold">REVIEW THIS TOPIC</button>`:''}</div></details>`).join('')}</div></div><aside class="space-y-4"><div class="card p-5"><h3 class="font-black">Your weak areas</h3><div class="mt-3 space-y-3">${weak.length?weak.map(w=>`<button onclick="openTopic('${w.courseId}',${JSON.stringify(w.topic)})" class="w-full text-left"><div class="flex justify-between text-sm"><span>${esc(w.topic)}</span><b>${w.score}%</b></div><div class="h-2 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-2 rounded-full bg-rose-500" style="width:${w.score}%"></div></div></button>`).join(''):'<p class="text-sm text-slate-500">No weak topics identified in this attempt.</p>'}</div></div><div class="card p-5"><h3 class="font-black">Flagged questions</h3><p class="mt-1 text-sm text-slate-500">${flagged.length} flagged for review</p><div class="mt-3 text-sm">${flagged.map(x=>`<div class="py-1">⚑ ${esc(x.q.topic)}</div>`).join('')||'None'}</div></div></aside></div><div class="mt-5 flex gap-2"><button onclick="setPage('cbt')" class="rounded-xl bg-teal-700 text-white px-5 py-3 font-black">Another CBT</button><button onclick="setPage('dashboard')" class="rounded-xl border px-5 py-3 font-black">View Dashboard</button></div>`)}
function weakTopicsFrom(details){let map={};details.forEach(x=>{let k=x.q.course+'::'+x.q.topic;if(!map[k])map[k]={course:x.q.course,topic:x.q.topic,total:0,correct:0};map[k].total++;if(x.ok)map[k].correct++});return Object.values(map).map(x=>({...x,score:Math.round(x.correct/x.total*100),courseId:courseByName(x.course)?.id||''})).filter(x=>x.score<70).sort((a,b)=>a.score-b.score)}
function weakTopics(){let map={};Object.entries(store.attempted).forEach(([id,a])=>{let q=allQuestions().find(x=>x.id===id);if(!q)return;let k=q.course+'::'+q.topic;if(!map[k])map[k]={course:q.course,topic:q.topic,total:0,correct:0,courseId:courseByName(q.course)?.id||''};map[k].total+=a.attempts;map[k].correct+=a.correct});return Object.values(map).map(x=>({...x,score:Math.round(x.correct/x.total*100)})).filter(x=>x.total>0&&x.score<70).sort((a,b)=>a.score-b.score)}
function dashboard(){let qs=allQuestions().filter(q=>q.programme===state.programme),a=Object.values(store.attempted),attempted=a.reduce((s,x)=>s+x.attempts,0),correct=a.reduce((s,x)=>s+x.correct,0),pct=attempted?Math.round(correct/attempted*100):0,weak=weakTopics(),courseStats=courses().map(c=>{let aa=Object.entries(store.attempted).filter(([id])=>allQuestions().find(q=>q.id===id)?.course===c.name).map(([,x])=>x);let at=aa.reduce((s,x)=>s+x.attempts,0),co=aa.reduce((s,x)=>s+x.correct,0);return {c,at,score:at?Math.round(co/at*100):0}}).filter(x=>x.at).sort((a,b)=>a.score-b.score);return layout('My Dashboard',`<section class="grid grid-cols-2 md:grid-cols-4 gap-3">${stat('Questions attempted',attempted)}${stat('Average accuracy',pct+'%')}${stat('Topics completed',Object.keys(store.completedTopics).length)}${stat('CBT sessions',store.history.length)}</section><section class="mt-6 grid lg:grid-cols-2 gap-4"><div class="card p-5"><h2 class="text-xl font-black">Course performance</h2><div class="mt-4 space-y-3">${courseStats.length?courseStats.slice(0,10).map(x=>`<div><div class="flex justify-between text-sm"><span>${esc(x.c.name)}</span><b>${x.score}%</b></div><div class="h-2 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-2 rounded-full ${x.score<70?'bg-rose-500':'bg-teal-600'}" style="width:${x.score}%"></div></div><div class="text-xs text-slate-500 mt-1">${x.at} questions attempted</div></div>`).join(''):'<p class="text-slate-500">No course data yet.</p>'}</div></div><div class="card p-5"><h2 class="text-xl font-black">Weak topics</h2><div class="mt-4 space-y-3">${weak.length?weak.slice(0,8).map(w=>`<button onclick="openTopic('${w.courseId}',${JSON.stringify(w.topic)})" class="w-full text-left"><div class="flex justify-between text-sm"><span>${esc(w.topic)}</span><b>${w.score}%</b></div><div class="h-2 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-2 bg-rose-500 rounded-full" style="width:${w.score}%"></div></div></button>`).join(''):'<p class="text-slate-500">Complete practice questions to unlock weak-topic analysis.</p>'}</div></div></section><section class="mt-6 card p-5"><h2 class="text-xl font-black">Recent CBT history</h2><div class="mt-4 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-2">Date</th><th class="p-2">Questions</th><th class="p-2">Score</th><th class="p-2">Time</th></tr></thead><tbody>${store.history.slice(0,10).map(h=>`<tr class="border-b"><td class="p-2">${new Date(h.date).toLocaleString()}</td><td class="p-2">${h.total}</td><td class="p-2">${h.pct}%</td><td class="p-2">${formatTime(h.timeUsed)}</td></tr>`).join('')||'<tr><td colspan="4" class="p-3 text-slate-500">No CBT history yet.</td></tr>'}</tbody></table></div></section><section class="mt-6 card p-5"><h2 class="text-xl font-black">Exam intelligence</h2><p class="mt-2 text-sm text-slate-500">These are learning statistics only. They do not predict what will appear in a CHPRBN examination.</p><div class="mt-4 grid sm:grid-cols-2 md:grid-cols-4 gap-3">${stat('Available questions',qs.length)}${stat('Attempted',attempted)}${stat('Topics studied',Object.keys(store.completedTopics).length)}${stat('Authentic exposure',a.reduce((s,x)=>s+x.correct*0,0)+' verified records')}</div></section>`)}
function clinical(){return layout('Clinical Scenario Trainer',`<div class="card p-5 border-teal-200 bg-teal-50 dark:bg-teal-950/20"><b>Scope and safety:</b> These scenarios teach assessment, recognition, referral and documentation. Follow the current CHPRBN National Standing Orders and local authorized protocol; do not use the trainer as permission to practise outside scope.</div><div class="mt-5 grid md:grid-cols-2 gap-4">${DATA.scenarios.map(s=>`<article class="card p-5"><span class="text-xs font-black text-teal-700">SCENARIO TRAINER</span><h2 class="mt-2 text-xl font-black">${esc(s.title)}</h2><p class="mt-2 text-sm">${esc(s.prompt)}</p><button onclick="startScenario('${s.id}')" class="mt-4 rounded-xl bg-teal-700 text-white px-4 py-3 font-black">START SCENARIO</button></article>`).join('')}</div>`)}
function startScenario(id){state.scenario=DATA.scenarios.find(s=>s.id===id);state.scenarioStep=0;state.page='scenario';render()}
function scenario(){let s=state.scenario;if(!s)return clinical();let step=Math.min(state.scenarioStep,s.steps.length);return layout(s.title,`<div class="card p-5 md:p-7"><span class="text-xs font-black text-teal-700">CLINICAL SCENARIO · STEP ${step}/${s.steps.length}</span><h2 class="mt-3 text-2xl font-black">${esc(s.prompt)}</h2><div class="mt-5">${step<s.steps.length?`<div class="rounded-2xl bg-slate-50 dark:bg-slate-800 p-5"><b>Learning checkpoint ${step+1}</b><p class="mt-2">${esc(s.steps[step])}</p></div><button onclick="state.scenarioStep++;render()" class="mt-4 rounded-xl bg-teal-700 text-white px-5 py-3 font-black">NEXT STEP</button>`:`<div class="success card p-5"><b>Scenario takeaway</b><p class="mt-2">${esc(s.key)}</p><p class="mt-3 text-sm">Always follow the current National Standing Orders and refer when indicated.</p></div><button onclick="setPage('clinical')" class="mt-4 rounded-xl border px-5 py-3 font-black">Back to scenarios</button>`}</div></div>`)}
function daily(){let w=weakTopics();let focus=w[0];return layout("Today's Study",`<div class="card p-6"><span class="text-xs font-black text-teal-700">EDUCATIONAL GUIDANCE</span><h2 class="mt-2 text-2xl font-black">${focus?`Focus on ${esc(focus.topic)}`:'Build your first study session'}</h2><p class="mt-2 text-slate-500">This recommendation is based on your local practice history, not a prediction of examination content.</p><ol class="mt-5 space-y-3 list-decimal pl-5"><li>Read the topic learning page.</li><li>Review the key concepts and common exam traps.</li><li>Complete 10 practice questions.</li><li>Review every wrong answer.</li><li>Mark the topic complete after you understand it.</li></ol>${focus?`<button onclick="openTopic('${focus.courseId}',${JSON.stringify(focus.topic)})" class="mt-5 rounded-xl bg-teal-700 text-white px-5 py-3 font-black">START RECOMMENDED TOPIC</button>`:`<button onclick="setPage('courses')" class="mt-5 rounded-xl bg-teal-700 text-white px-5 py-3 font-black">CHOOSE A COURSE</button>`}</div>`)}
function sources(){return layout('Sources & References',`<div class="grid md:grid-cols-2 gap-4">${DATA.sources.map(s=>`<article class="card p-5"><a href="${esc(s.url)}" target="_blank" rel="noopener" class="font-black text-teal-700 underline">${esc(s.title)}</a><p class="mt-2 text-sm text-slate-500">${esc(s.note)}</p></article>`).join('')}</div><section class="mt-6 card p-5 border-amber-200 bg-amber-50 dark:bg-amber-950/20"><h2 class="font-black">Curriculum verification note</h2><p class="mt-2 text-sm">The official CHPRBN website currently lists JCHEW Curriculum and CHEW Curriculum under Resources. This application uses the 2022 curriculum baseline reflected in the publicly indexed CHPRBN curriculum documents and preserves the JCHEW/CHEW distinction. If CHPRBN publishes a newer curriculum revision, update the course dataset before claiming that revision is current.</p></section><section class="mt-4 card p-5 border-red-200 bg-red-50 dark:bg-red-950/20"><h2 class="font-black">Standing Orders note</h2><p class="mt-2 text-sm">Clinical guidance must follow the current authorized CHPRBN National Standing Orders. The 2024 revised JCHEW and CHEW Standing Orders are linked above. Do not rely on an old note, screenshot or memory where the current official document differs.</p></section><section class="mt-4 card p-5"><h2 class="font-black">Past-question verification</h2><p class="mt-2 text-sm">Authentic national past questions are currently set to <b>0 verified records</b>. This is intentional. The database architecture is ready for future imports with year, programme, course, topic, source, sourceUrl, verified and type fields.</p></section>`)}
function render(){document.documentElement.classList.toggle('dark',store.theme==='dark');let content=state.page==='home'?home():state.page==='courses'?coursesPage():state.page==='course'?coursePage():state.page==='topic'?topicPage():state.page==='library'?library():state.page==='cbt'?cbt():state.page==='run'?runCBT():state.page==='results'?results():state.page==='dashboard'?dashboard():state.page==='clinical'?clinical():state.page==='scenario'?scenario():state.page==='bookmarks'?bookmarks():state.page==='daily'?daily():sources();document.getElementById('app').innerHTML=header()+content+nav()+(state.toast?`<div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 rounded-xl bg-slate-900 text-white px-4 py-3 shadow-xl">${esc(state.toast)}</div>`:'');document.getElementById('cbtTime')?.addEventListener('change',e=>document.getElementById('customWrap')?.classList.toggle('hidden',e.target.value!=='custom'));document.title=`${META.name} · ${state.programme}`}
window.setPage=setPage;window.setProgramme=setProgramme;window.toggleTheme=toggleTheme;window.openCourse=openCourse;window.courseCBT=courseCBT;window.openTopic=openTopic;window.startCBT=startCBT;window.startFilteredCBT=startFilteredCBT;window.answerQ=answerQ;window.flagQ=flagQ;window.nextQ=nextQ;window.prevQ=prevQ;window.jumpQ=jumpQ;window.finishCBT=finishCBT;window.toggleBookmarkQuestion=toggleBookmarkQuestion;window.toggleBookmarkTopic=toggleBookmarkTopic;window.startScenario=startScenario;window.markTopic=markTopic;
// Extra desktop/mobile routes exposed without adding complexity to the core router.
const oldSetPage=setPage;window.setPage=function(p){if(p==='daily'||p==='bookmarks'||p==='dashboard'||p==='clinical'){state.page=p;state.topic=null;render();scrollTo(0,0);return}oldSetPage(p)};
render();
</script></body></html>
